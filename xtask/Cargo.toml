[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# Pure-Rust blocking HTTP client. TLS is switched off entirely (`deb.debian.org`
# is fetched over plain HTTP through the sandbox egress proxy), which keeps
# rustls/ring (C code) out of the build. `proxy-from-env` makes ureq honour
# HTTP(S)_PROXY, which the sandbox requires.
ureq = { version = "2", default-features = false, features = ["proxy-from-env"] }
serde_json = "1"
# Pure-Rust SHA-256, used to verify every downloaded .deb before unpacking.
sha2 = "0.11"

[lints]
workspace = true
