# cargo-deny configuration: `cargo deny check`.
# Workspace crates declare no `license` field, so they are treated as private.

[graph]
all-features = true

[advisories]
# Advisory database is the RustSec one; ignores live in .cargo/audit.toml too.
ignore = [
    # bincode 2.0.1: unmaintained, but functional. No fixed version exists (the
    # advisory's remedy is migrating to another crate); tracked for a future
    # migration. Direct dependent is space-protocol (the wire codec), so it
    # reaches space-net, space-sim, space-scene, space-server, space-orchestrator,
    # space-client and the MCP crates (`cargo tree -i bincode`).
    "RUSTSEC-2025-0141",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    # IJG: the JPEG Group's reference-implementation license, unavoidable for
    # JPEG encoders. Needed by jpeg-encoder 0.7.1 ((MIT OR Apache-2.0) AND IJG),
    # pulled in via space-stream (the pixel-stream client).
    "IJG",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
