# PRODUCTION compose for the proxy host: pulls the prebuilt ghcr.io images pushed
# by .github/workflows/release-images.yml (no build section). Installed in
# /home/proxy/stacks/space/ next to .env (and a ./state directory).
#
# Auto-redeploy: the already-running Watchtower container (polls every 60s) only
# updates containers that opt in with the label
# `com.centurylinklabs.watchtower.enable: "true"`; orchestrator, shard-a and client
# carry it, so a new image on ghcr is pulled and the container recreated within
# ~60s of the push. The images are public (anonymous pull, no docker login).
# Every push to main publishes all three.
#
# The browser viewer page is NOT served here: it is a local development and
# agent-testing tool (see AGENTS.md and crates/space-viewer/README.md), not part
# of the deployment.
#
# NOT RUN from here (it pulls the published ghcr images and belongs on the
# host): checked with `docker compose config` against .env.example only. Topology and addressing match deploy/docker-compose.yaml
# (fixed IPv4s on the bridge: addresses are parsed as socket addresses).
# Subnet is 172.29.0.0/24 (NOT 172.31.0.0/24 as in deploy/docker-compose.yaml):
# 172.31.0.0/24 collides with an existing docker network on the proxy host.
#
# Configuration is by ENVIRONMENT variables, not `command:`: each image's
# ENTRYPOINT is `/bin/sh -c 'exec <bin> --flags "$ENV"...'` (see deploy/Dockerfile.*),
# so a compose `command:` would only become ignored positional args to that
# script. Env vars verified against the Dockerfiles:
#   orchestrator: ORCHESTRATOR_BIND, ORCHESTRATOR_CONTROL_ADDR (required), SPACE_CLUSTER,
#                 SPACE_ORCHESTRATOR_SCENE, SPACE_ORCHESTRATOR_WEBUI[_TOKEN] (read by the binary)
#   shard:        ORCHESTRATOR_ADDR (required), SHARD_BIND, SHARD_ADVERTISE (required), SPACE_CLUSTER
#   client:       STREAM_BIND (-> --stream), SPACE_SERVER (-> --server), CLIENT_ARGS (extra flags)
#
#   docker compose up -d        # orchestrator + shard-a + client

x-cluster: &cluster
  SPACE_CLUSTER: ${SPACE_CLUSTER:-space-prod}

services:
  orchestrator:
    image: ghcr.io/eliasstepanik/space-orchestrator:${SPACE_TAG:-latest}
    container_name: space-orchestrator
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      <<: *cluster
      ORCHESTRATOR_BIND: 0.0.0.0:7900
      ORCHESTRATOR_CONTROL_ADDR: 172.29.0.10:7900
      # Initial scene only: one chosen in the web UI is saved in ./state and wins.
      SPACE_ORCHESTRATOR_SCENE: ${SPACE_SCENE:-demo-area}
      # Operator web UI: OFF while SPACE_WEBUI_BIND is empty. Set BOTH values in
      # .env to switch it on (see .env.example): with a bind and no token the
      # orchestrator refuses to start.
      SPACE_ORCHESTRATOR_WEBUI: ${SPACE_WEBUI_BIND:-}
      SPACE_ORCHESTRATOR_WEBUI_TOKEN: ${SPACE_WEBUI_TOKEN:-}
    volumes:
      - ./state:/var/lib/space
    ports:
      - "${ORCHESTRATOR_PORT:-7900}:7900/udp"
      # The web UI is plain HTTP with Basic auth, so it is published on the
      # host's LOOPBACK only. Reach it through an SSH tunnel:
      #   ssh -L 7980:127.0.0.1:7980 <host>     then http://127.0.0.1:7980/
      - "127.0.0.1:${WEBUI_PORT:-7980}:7980/tcp"
    networks:
      space:
        ipv4_address: 172.29.0.10
    restart: unless-stopped

  shard-a:
    image: ghcr.io/eliasstepanik/space-shard:${SPACE_TAG:-latest}
    container_name: space-shard-a
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      - orchestrator
    environment:
      <<: *cluster
      ORCHESTRATOR_ADDR: 172.29.0.10:7900
      SHARD_BIND: 0.0.0.0:7870
      SHARD_ADVERTISE: 172.29.0.11:7870
    ports:
      - "${SHARD_PORT:-7870}:7870/udp"
    networks:
      space:
        ipv4_address: 172.29.0.11
    restart: unless-stopped

  client:
    image: ghcr.io/eliasstepanik/space-client:${SPACE_TAG:-latest}
    container_name: space-client
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      - shard-a
    # Image ENTRYPOINT runs: space-client --stream "$STREAM_BIND"
    # [--server "$SPACE_SERVER"] $CLIENT_ARGS  (no `command:` on purpose).
    environment:
      STREAM_BIND: 0.0.0.0:8099
      SPACE_SERVER: 172.29.0.11:7870
      # Extra space-client flags; the scene is the orchestrator's choice.
      CLIENT_ARGS: ""
    ports:
      - "${CLIENT_PORT:-8099}:8099/tcp"
    networks:
      space:
        ipv4_address: 172.29.0.12
    # The image renders on software Vulkan (lavapipe, Mesa 25), so no GPU is
    # needed; it exits 1 only when no Vulkan device with
    # VK_KHR_acceleration_structure can be found. Not auto-restarted so that such
    # a host does not churn sessions. The client itself reconnects when the shard
    # restarts, and viewer input cannot make it quit.
    restart: "no"

networks:
  space:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
