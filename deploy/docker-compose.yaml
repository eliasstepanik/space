# Space cluster: one orchestrator + ONE shard on a user-defined bridge network.
#
#   export SPACE_CLUSTER_SECRET="$(openssl rand -hex 24)"     # required, see below
#   docker compose -f deploy/docker-compose.yaml up --build
#
# Run locally with Docker 28, including the `stream` profile: see "What is and
# is not verified" in deploy/README.md.
#
# The cluster starts with ONE shard. The orchestrator pre-allocates the root
# region's owner and the first region-less hello (shard-a, no --shard, no region
# claim) adopts it. Every further shard that registers the same way is given a
# region by the orchestrator (the next layout cell beside the scene's spawn
# point), up to --max-shards; a split starts its own (`--launcher local`: inside
# the orchestrator's process).
#
# The control port binds 0.0.0.0 in the container, and a control port that is not
# on loopback takes a shard's hello only with the CLUSTER SECRET (and the
# orchestrator refuses to start without one). Both services are given it from
# SPACE_CLUSTER_SECRET, which has NO default: the repository holds no secret.
# Set it in your shell or in a `.env` file next to this compose file (which is
# not checked in) to at least 16 random characters; without it `docker compose`
# stops with a message saying so, before anything is started.
#
# The control port (7900/udp) is NOT published on the host: only the shards
# use it, and they reach it over the compose network. Whoever can reach it can
# try to register as a shard, so it stays where only the shards are.
#
# Addressing: `--orchestrator`, `--control-addr` and `--advertise` are parsed as
# socket ADDRESSES, not resolved as host names, so every container gets a fixed
# IPv4 on the bridge subnet below.
#
#   orchestrator  172.31.0.10:7900   binds 0.0.0.0:7900, shards dial 172.31.0.10:7900
#                                    (inside the compose network only)
#                 172.31.0.10:7980   operator web UI (HTTP), on the host at
#                                    http://127.0.0.1:7980/ (any user name,
#                                    password = SPACE_WEBUI_TOKEN, by default
#                                    `space-local-dev-token`)
#   shard-a       172.31.0.11:7870   binds 0.0.0.0:7870, advertises 172.31.0.11:7870
#   client        172.31.0.12:8099   (profile "stream" only) ws:// pixel stream,
#                                    plays on shard-a at 172.31.0.11:7870
#
# Shards advertise their in-network address (peers dial each other over the
# bridge). Clients on the host use the published UDP port 7871; a shard that
# must hand out a host-reachable address to clients would advertise the host
# address instead (the plan's two-address case, R12, is not implemented here).
#
# The shard registers with ShardHello and is placed by the orchestrator. If it
# restarts it re-advertises the same address, which the orchestrator recognises
# as that shard having come back: it is given the old one's region under a NEW
# id (and the scene is rebuilt once). A shard that loses the orchestrator exits,
# and `restart: unless-stopped` starts a fresh one. The orchestrator runs
# `--launcher local`: `--launcher docker` is deferred.
#
# The streaming client is OPT-IN so a plain `up` stays orchestrator + shard:
#
#   docker compose -f deploy/docker-compose.yaml --profile stream up --build
#
# It publishes the ws:// stream on host TCP 8099. The wasm viewer is served
# separately by any static file server (see deploy/README.md), e.g. open
# index.html?ws=ws://127.0.0.1:8099.

x-cluster: &cluster
  SPACE_CLUSTER: space-local
  # What a shard's hello must carry (at least 16 characters). REQUIRED, and
  # there is no default: a secret that is checked in is not one.
  SPACE_CLUSTER_SECRET: "${SPACE_CLUSTER_SECRET:?set SPACE_CLUSTER_SECRET to at least 16 random characters, in your shell or in deploy/.env - the cluster secret has no default}"

x-shard: &shard
  build:
    context: ..
    dockerfile: deploy/Dockerfile.shard
  image: space/shard:dev
  depends_on:
    - orchestrator
  restart: unless-stopped

services:
  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
    image: space/orchestrator:dev
    environment:
      <<: *cluster
      ORCHESTRATOR_BIND: 0.0.0.0:7900
      # What shards dial; distinct from the wildcard bind above.
      ORCHESTRATOR_CONTROL_ADDR: 172.31.0.10:7900
      # The scene every shard runs until an operator picks another one in the
      # web UI (that choice is kept on the state volume and wins on restart).
      SPACE_ORCHESTRATOR_SCENE: ${SPACE_SCENE:-demo-area}
      # Operator web UI. In a container it has to bind the wildcard, and a
      # non-loopback bind refuses to start without a token. The default token is
      # for THIS LOCAL STACK ONLY: the port below is published on the host's
      # loopback interface. Set SPACE_WEBUI_TOKEN before publishing it anywhere.
      SPACE_ORCHESTRATOR_WEBUI: 0.0.0.0:7980
      SPACE_ORCHESTRATOR_WEBUI_TOKEN: ${SPACE_WEBUI_TOKEN:-space-local-dev-token}
    volumes:
      - orchestrator-state:/var/lib/space
    ports:
      # Only the web UI, on the host's loopback. The control port (7900/udp)
      # is deliberately not here: the shards reach it over the `space` network.
      - "127.0.0.1:7980:7980/tcp"
    networks:
      space:
        ipv4_address: 172.31.0.10
    restart: unless-stopped

  shard-a:
    <<: *shard
    container_name: space-shard-a
    environment:
      <<: *cluster
      ORCHESTRATOR_ADDR: 172.31.0.10:7900
      SHARD_BIND: 0.0.0.0:7870
      SHARD_ADVERTISE: 172.31.0.11:7870
    ports:
      - "7871:7870/udp"
    networks:
      space:
        ipv4_address: 172.31.0.11

  client:
    profiles: ["stream"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: space/client:dev
    container_name: space-client
    depends_on:
      - shard-a
    environment:
      STREAM_BIND: 0.0.0.0:8099
      # The shard's in-network address (an `ip:port`, like the other fixed IPs).
      SPACE_SERVER: 172.31.0.11:7870
      # Extra space-client flags (e.g. "--size 1280x720 --quality medium").
      # The scene is not one of them: the orchestrator decides it.
      CLIENT_ARGS: ""
    ports:
      - "8099:8099/tcp"
    networks:
      space:
        ipv4_address: 172.31.0.12
    restart: unless-stopped

volumes:
  orchestrator-state:

networks:
  space:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
