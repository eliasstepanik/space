# Space cluster, local: ONE service, the orchestrator. It starts its shards
# itself - one container each, through the Docker socket mounted below - when
# it starts, and creates, stops and removes shard containers by itself from
# then on (four to begin with, up to eight under load, replaced when one dies).
#
#   export SPACE_CLUSTER_SECRET="$(openssl rand -hex 24)"     # required, see below
#   docker compose -f deploy/docker-compose.yaml up --build
#   space-client --server 127.0.0.1:7777                       # a client on the host
#
# `up --build` builds the orchestrator image only. The shard image has to exist
# under the name the orchestrator starts shards from (SPACE_SHARD_IMAGE below,
# default `space/shard:dev`) - build it once, and again after every change:
#
#   docker build -f deploy/Dockerfile.shard -t space/shard:dev .
#
# (The orchestrator pulls an image that is not on the host; `space/shard:dev`
# exists in no registry, so without the build the launch fails and says so.)
#
# What is where:
#
#   orchestrator   control port 7900/udp   NOT published: shards only, over the
#                                          `space` network, with the cluster secret
#                  player port  7777/udp   published: the one address players type
#                  web UI       7980/tcp   published on the host's LOOPBACK only
#                                          (any user name, password = SPACE_WEBUI_TOKEN,
#                                          by default `space-local-dev-token`)
#   shards         7870-7899/udp           each shard container publishes its own
#                                          port; a player is sent on to
#                                          `<the host it dialed>:<that port>`
#
# THE DOCKER SOCKET. Mounting /var/run/docker.sock makes this container able to
# do anything on the host that root can (start a privileged container, mount
# the host's disk). That is what "the orchestrator manages its shards" costs;
# docs/security-notes.md, "The Docker socket", says what is done about it:
# nothing a player or a shard sends reaches a Docker call, shards get no
# socket, no mount and no privilege, and the web UI - the one way to operate
# the orchestrator from outside - stays on loopback behind a token.
#
# The orchestrator does not run as root in its container. It is given the
# socket's GROUP instead (`group_add`): DOCKER_GID, default 0 - right for Docker
# Desktop, where the socket is root:root. On a Linux host set it to the
# socket's group: `export DOCKER_GID=$(stat -c %g /var/run/docker.sock)`.
#
# SPACE_CLUSTER_SECRET has NO default: the repository holds no secret. Set it in
# your shell or in a `.env` file next to this compose file (which is not checked
# in) to at least 16 random characters; without it `docker compose` stops with a
# message saying so, before anything is started. The orchestrator hands it to
# the shards it starts, in their environment (never on a command line).
#
# Stopping: `docker compose down` sends the orchestrator SIGTERM; it removes
# its shard containers (bounded: 20 s) and exits - `stop_grace_period` below
# gives it that time. Should it be killed instead, its shards notice within
# about ten seconds and exit, and the next start removes what is left of them
# first: the containers labelled space.cluster=<SPACE_CLUSTER>,
# space.role=shard AND space.instance=<this compose project> - its own, never
# another stack's.
#
# A SECOND STACK ON THE SAME HOST is another compose project with its own
# ports and its own container names - nothing else: the project's name is the
# instance that tells its shards from this one's (two stacks may even share a
# cluster name; give each its own anyway, it is what the web UI and the logs
# show):
#
#   SPACE_CLUSTER=space-two SPACE_PLAYER_PORT=7877 WEBUI_PORT=7981 \
#   SPACE_SHARD_PORTS=7970-7999 SPACE_SHARD_NAME_PREFIX=space-two-shard- \
#     docker compose -p space-two -f deploy/docker-compose.yaml up -d
#
# The streaming client is OPT-IN (`--profile stream`); it reaches the cluster
# the way a player does, through the host's published ports.

services:
  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
      args:
        SPACE_SHARD_IMAGE: ${SPACE_SHARD_IMAGE:-space/shard:dev}
    image: ${SPACE_ORCHESTRATOR_IMAGE:-space/orchestrator:dev}
    environment:
      SPACE_CLUSTER: ${SPACE_CLUSTER:-space-local}
      # What a shard's hello must carry (at least 16 characters). REQUIRED, and
      # there is no default: a secret that is checked in is not one.
      SPACE_CLUSTER_SECRET: "${SPACE_CLUSTER_SECRET:?set SPACE_CLUSTER_SECRET to at least 16 random characters, in your shell or in deploy/.env - the cluster secret has no default}"
      ORCHESTRATOR_BIND: 0.0.0.0:7900
      # The shard manager: --launcher docker --min-shards 4 --max-shards 8.
      SPACE_ORCHESTRATOR_LAUNCHER: docker
      SPACE_ORCHESTRATOR_MIN_SHARDS: ${SPACE_MIN_SHARDS:-4}
      SPACE_ORCHESTRATOR_MAX_SHARDS: ${SPACE_MAX_SHARDS:-8}
      SPACE_ORCHESTRATOR_SHARD_IMAGE: ${SPACE_SHARD_IMAGE:-space/shard:dev}
      # Host UDP ports for the shards, one each, published by the shard
      # containers themselves; and the host address they are published on.
      SPACE_ORCHESTRATOR_HOST_PORTS: ${SPACE_SHARD_PORTS:-7870-7899}
      SPACE_ORCHESTRATOR_DOCKER_PUBLISH_IP: ${SPACE_SHARD_PUBLISH_IP:-0.0.0.0}
      SPACE_ORCHESTRATOR_DOCKER_NAME_PREFIX: ${SPACE_SHARD_NAME_PREFIX:-space-shard-}
      # This container's own NAME, which the orchestrator inspects to find the
      # network its shards join and the address they dial. (Not its host
      # name: Docker finds a container by name or id, and the host name is the
      # id only until the container is recreated from an older one.)
      SPACE_ORCHESTRATOR_DOCKER_SELF: ${SPACE_ORCHESTRATOR_CONTAINER:-${COMPOSE_PROJECT_NAME}-orchestrator-1}
      # What tells this stack's shard containers from another stack's on the
      # same host (label space.instance): the compose project.
      SPACE_ORCHESTRATOR_DOCKER_INSTANCE: ${SPACE_INSTANCE:-${COMPOSE_PROJECT_NAME}}
      # Memory limit of each shard container in MiB (empty = 2048; 0 = none).
      SPACE_ORCHESTRATOR_SHARD_MEMORY: ${SPACE_SHARD_MEMORY:-}
      # The one address players type.
      SPACE_ORCHESTRATOR_PLAYER_BIND: 0.0.0.0:7777
      # The scene every shard runs until an operator picks another one in the
      # web UI (that choice is kept on the state volume and wins on restart).
      SPACE_ORCHESTRATOR_SCENE: ${SPACE_SCENE:-demo-area}
      # Operator web UI. In a container it has to bind the wildcard, and a
      # non-loopback bind refuses to start without a token. The default token is
      # for THIS LOCAL STACK ONLY: the port below is published on the host's
      # loopback interface. Set SPACE_WEBUI_TOKEN before publishing it anywhere.
      SPACE_ORCHESTRATOR_WEBUI: 0.0.0.0:7980
      SPACE_ORCHESTRATOR_WEBUI_TOKEN: ${SPACE_WEBUI_TOKEN:-space-local-dev-token}
      # The autoscaler's thresholds, when you want to watch it with a handful
      # of clients (empty = the defaults: 100 players a shard, out at 0.8 for
      # 10 s, in at 0.35 for 60 s, 30 s cooldown).
      SPACE_ORCHESTRATOR_SHARD_CAPACITY: ${SPACE_SHARD_CAPACITY:-}
      SPACE_ORCHESTRATOR_SCALE_OUT_AFTER: ${SPACE_SCALE_OUT_AFTER:-}
      SPACE_ORCHESTRATOR_SCALE_IN_AFTER: ${SPACE_SCALE_IN_AFTER:-}
      SPACE_ORCHESTRATOR_SCALE_COOLDOWN: ${SPACE_SCALE_COOLDOWN:-}
    volumes:
      - orchestrator-state:/var/lib/space
      # The Docker Engine's socket: how the orchestrator starts and stops its
      # shards. Root-equivalent on the host - see the header.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      # The player port. (The control port, 7900/udp, is deliberately not
      # here: the shards reach it over the `space` network.)
      - "${SPACE_PLAYER_PORT:-7777}:7777/udp"
      # The web UI, on the host's loopback.
      - "127.0.0.1:${WEBUI_PORT:-7980}:7980/tcp"
    networks:
      - space
    # Time to remove its shard containers on `down` / `stop`.
    stop_grace_period: 30s
    restart: unless-stopped

  client:
    profiles: ["stream"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: space/client:dev
    container_name: space-client
    depends_on:
      - orchestrator
    environment:
      STREAM_BIND: 0.0.0.0:8099
      # A player like any other: the player port ON THE HOST, so that the
      # shard it is sent on to (`<the host it dialed>:<shard port>`) is the
      # shard's published port.
      SPACE_SERVER: host.docker.internal:${SPACE_PLAYER_PORT:-7777}
      # Extra space-client flags (e.g. "--size 1280x720 --quality medium").
      # The scene is not one of them: the orchestrator decides it.
      CLIENT_ARGS: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8099:8099/tcp"
    restart: unless-stopped

volumes:
  orchestrator-state:

networks:
  space:
    driver: bridge
