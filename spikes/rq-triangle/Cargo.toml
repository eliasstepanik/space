[package]
name = "rq-triangle"
version = "0.0.0"
edition = "2021"
rust-version = "1.100"
publish = false

# Standalone: keep this throwaway spike out of the root `space` workspace.
[workspace]

[dependencies]
# ash 0.38.0 is the current published release (VK 1.3.281 headers). It exposes
# the full VK_KHR_acceleration_structure / VK_KHR_ray_query surface we need.
ash = "0.38"
# Validated here so `space-render-ash` can adopt it with confidence.
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
# gpu-allocator's leak reporting takes a log::Level.
log = "0.4"

[build-dependencies]
# WGSL -> SPIR-V at build time. naga 30 is required: it is the release that
# supports the `wgpu_ray_query` enable extension plus rayQueryConfirmIntersection
# / rayQueryGenerateIntersection, and it emits a working rayQueryTerminate.
# (naga 24 cannot even parse this shader — see the README verdict.)
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

[[bin]]
name = "rq-triangle"
path = "src/main.rs"
