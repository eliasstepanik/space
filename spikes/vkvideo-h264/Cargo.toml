[package]
name = "vkvideo-h264"
version = "0.0.0"
edition = "2021"
rust-version = "1.100"
publish = false

# Standalone: keep this throwaway spike OUT of the root `space` workspace.
[workspace]

[[bin]]
name = "vkvideo-h264"
path = "src/main.rs"

[dependencies]
# ash 0.38.0 = current published release (VK 1.3.281 headers), same as vkprobe.
ash = "0.38"
# Pure-Rust WGSL -> SPIR-V compiler (no C/glslang bindings), same as stream-loop.
naga = { version = "30.0", features = ["wgsl-in", "spv-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Used by the CDP smoke driver only.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"

[profile.release]
lto = "thin"
