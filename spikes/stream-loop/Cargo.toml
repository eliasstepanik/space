[package]
name = "stream-loop"
version = "0.0.0"
edition = "2021"
rust-version = "1.100"
publish = false

# Standalone: keep this throwaway spike OUT of the root `space` workspace.
[workspace]

[[bin]]
name = "host"
path = "src/bin/host.rs"

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"

[dependencies]
# ash 0.38.0 = current published release (VK 1.3.281 headers), same as vkprobe.
ash = "0.38"
# Pure-Rust WGSL -> SPIR-V compiler (no C/glslang bindings).
naga = { version = "30.0", features = ["wgsl-in", "spv-out"] }
# Pure-Rust JPEG encoder (no C bindings). Chosen crate for the spike.
jpeg-encoder = "0.7"
# Binary WebSocket transport.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
