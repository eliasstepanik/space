[package]
name = "vkprobe"
version = "0.0.0"
edition = "2021"
rust-version = "1.100"
publish = false

# Standalone: keep this package out of the root `space` workspace.
[workspace]

[dependencies]
# ash 0.38.0 is the current published release (VK 1.3.281 headers).
ash = "0.38"
serde_json = "1"

[[bin]]
name = "vkprobe"
path = "src/main.rs"
