[package]
name = "space-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Model Context Protocol core: JSON-RPC 2.0 dispatch, tool registry, hand-rolled Streamable HTTP (HTTP/1.1 + SSE) and stdio transports"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# `io-std` is only needed for the stdio transport (tokio::io::stdin/stdout).
tokio = { workspace = true, features = ["io-std"] }

[lints]
workspace = true
