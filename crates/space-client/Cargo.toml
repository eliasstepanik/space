[package]
name = "space-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Native client: winit window + space-render, offline demo of the deterministic galaxy"

[dependencies]
space-render = { workspace = true }
space-world = { workspace = true }
space-stream = { workspace = true, features = ["net"] }
