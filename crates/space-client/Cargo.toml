[package]
name = "space-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Native client: winit window + space-render, offline demo of the deterministic galaxy"

[lib]
path = "src/lib.rs"

[[bin]]
name = "space-client"
path = "src/main.rs"

[dependencies]
space-render = { workspace = true }
space-world = { workspace = true }
space-stream = { workspace = true, features = ["net"] }
space-net = { path = "../space-net" }
space-protocol = { workspace = true }
space-sim = { workspace = true }
space-ecs = { workspace = true }
tokio = { workspace = true }
winit = { workspace = true }
raw-window-handle = { workspace = true }
log = { workspace = true }
env_logger = "0.11"

[dev-dependencies]
space-server = { path = "../space-server" }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
