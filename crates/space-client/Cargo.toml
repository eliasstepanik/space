[package]
name = "space-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Native client: always online, with a connect screen; window, headless and pixel-stream front ends over one core, drivable through space-harness"

[lib]
path = "src/lib.rs"

[[bin]]
name = "space-client"
path = "src/main.rs"

[dependencies]
space-render = { workspace = true }
space-world = { workspace = true }
space-stream = { workspace = true, features = ["net"] }
space-harness = { workspace = true }
space-net = { path = "../space-net" }
space-protocol = { workspace = true }
space-sim = { workspace = true }
# The shared physical definition of the scenes: the anchor rule, the statics
# the showcase draws, the shape catalogue, the prediction world's environment.
space-scene = { workspace = true }
space-ecs = { workspace = true }
tokio = { workspace = true }
winit = { workspace = true }
raw-window-handle = { workspace = true }
log = { workspace = true }
# The pin store (`tofu.rs`) is a JSON file; serde_json is already in the lockfile.
serde_json = { workspace = true }
env_logger = "0.11"

[dev-dependencies]
# `tests/tofu.rs` builds a hostile server's TLS chain by hand.
rustls = { workspace = true }
quinn = { workspace = true }
space-server = { path = "../space-server" }
# `tests/entry.rs`: a client that enters through a real orchestrator's player
# port (the one address players type) and is sent on to a shard.
space-orchestrator = { path = "../space-orchestrator" }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
