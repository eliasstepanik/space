[package]
name = "space-sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Shared deterministic simulation: ship flight, rigid bodies with convex and concave collision shapes, springs, joints, gravity zones and large-body gravity, a ticked simulation world with a canonical state hash, on-rail orbits and client-side prediction with reconciliation"

[dependencies]
