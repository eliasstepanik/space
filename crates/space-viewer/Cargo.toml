[package]
name = "space-viewer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Thin wasm browser viewer: draws streamed JPEG frames on a canvas and sends input back"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Protocol only (no tokio): the viewer shares the exact input wire format.
space-stream = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "CanvasRenderingContext2d",
    "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event",
    "KeyboardEvent", "MouseEvent", "DomRect", "Blob", "BlobPropertyBag", "ImageBitmap", "console",
] }

[lints]
workspace = true
