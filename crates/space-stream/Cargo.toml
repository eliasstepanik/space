[package]
name = "space-stream"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Pixel streaming: JPEG frame encoder, ws:// stream server and the shared viewer wire protocol"

[features]
# `net` (default) = JPEG encoder + tokio/tungstenite stream server. Without it
# only the dependency-free wire protocol (`protocol`) is built, which is what the
# wasm viewer uses (tokio's networking does not build for wasm32).
# `jpeg` = the JPEG encoder alone (no tokio, no WebSocket), for users that only
# need to turn a frame into a JPEG (`space-harness`).
default = ["net"]
jpeg = ["dep:jpeg-encoder"]
net = ["jpeg", "dep:log", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
jpeg-encoder = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true
