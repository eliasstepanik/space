[package]
name = "space-mcp-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "MCP server (stdio / Streamable HTTP) that boots and inspects an in-process authoritative shard for agentic testing"

[[bin]]
name = "space-mcp-server"
path = "src/main.rs"

[dependencies]
space-mcp = { path = "../space-mcp" }
space-server = { path = "../space-server" }
space-protocol = { workspace = true }
space-sim = { workspace = true }
space-world = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
