[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/space-world",
    "crates/space-ecs",
    "crates/space-protocol",
    "crates/space-sim",
    "crates/space-net",
    "crates/space-server",
    "crates/space-render",
    "crates/space-client",
    "crates/space-orchestrator",
    "crates/space-stream",
    "crates/space-viewer",
    "crates/space-mcp",
    "crates/space-mcp-server",
    "crates/space-mcp-client",
    "crates/space-harness",
    "crates/space-scene",
    "crates/space-test-support",
]

[workspace.package]
edition = "2021"
rust-version = "1.100"

# Shared dependencies for workspace members, referenced as `dep.workspace = true`.
# Space crates are path dependencies so the workspace stays buildable offline;
# third-party deps must be pure Rust (no C code) — see docs/plan.md.
[workspace.dependencies]
# Used by later Phase-1 crates (ecs/protocol/sim/render); declared here so they
# can be added without touching the shared table again.
space-world = { path = "crates/space-world" }
space-ecs = { path = "crates/space-ecs" }
space-protocol = { path = "crates/space-protocol" }
space-sim = { path = "crates/space-sim" }
space-scene = { path = "crates/space-scene" }
space-render = { path = "crates/space-render" }
space-stream = { path = "crates/space-stream", default-features = false }
# Test helpers shared across crates (dev-dependency only; depends on no workspace crate).
space-test-support = { path = "crates/space-test-support" }
# Wire format: `serde` (derive) + `bincode` 2.x, both pure Rust.
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", default-features = false, features = ["std", "serde"] }
# Phase 2 netcode: quinn (QUIC) + rustls (TLS) + rcgen (self-signed certs), on a
# multi-threaded tokio runtime.
#
# NOTE: the `ring` feature here pulls in *ring*, which compiles hand-written
# assembly + C at build time. This is the ONE intentional, unavoidable exception
# to the "100% Rust, no C bindings" rule (see crates/space-net/src/crypto.rs
# module docs). quinn 0.11 hard-gates its rustls integration behind `rustls-ring`
# (or `rustls-aws-lc-rs`) and its provider seam can only return `ring` or
# `aws-lc-rs`; the pure-Rust candidates are not viable (`rustls-post-quantum` is
# built on the C-based `aws-lc-rs`; `rustls-rustcrypto` has unimplemented QUIC
# support). Leaving `ring` out fails to build. Revisit if quinn gains a pluggable
# provider and a pure-Rust provider grows working QUIC support.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# `ring` is also a direct dependency of space-net now (same sanctioned exception):
# PBKDF2 for the cluster CA seed and the Ed25519 public key of the cluster CA.
# It is the version rustls/quinn/rcgen already build, so Cargo.lock gains nothing.
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# `quinn::Connection::send_datagram` takes a `bytes::Bytes`.
bytes = "1"
# Phase 4 renderer stack (all pure Rust; ash loads Vulkan at runtime).
# ash 0.38 is what spikes/rq-triangle proved on RADV GFX1151 + lavapipe.
ash = "0.38"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
log = "0.4"
# WGSL -> SPIR-V at build time. naga >= 30 is a hard requirement: naga 24 has a
# broken rayQueryTerminate in its SPIR-V backend and cannot even parse
# `enable wgpu_ray_query;` — see spikes/rq-triangle/README.md.
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
winit = "0.30"
ash-window = "0.13"
raw-window-handle = "0.6"

# Phase 6 pixel streaming (both pure Rust, NO C code, NO TLS).
# `jpeg-encoder` is a pure-Rust baseline JPEG encoder. `tokio-tungstenite` is
# built with default features OFF and only `handshake`: the default `connect`
# feature and every `*-tls` feature are left out, so no rustls/ring/native-tls is
# pulled in for the stream path (ws:// only; wss:// would need `ring`, the
# sanctioned exception above, and is deferred). `futures-util` (already in the
# lock via tokio-tungstenite) provides the Sink/Stream extension traits.
# `simd` switches jpeg-encoder's colour conversion and forward DCT to AVX2 when
# the CPU has it (runtime-detected, scalar fallback otherwise). It is still pure
# Rust: the feature adds no dependency and no build script, it only lets the
# crate use `core::arch` intrinsics (so it drops its own `forbid(unsafe_code)`).
jpeg-encoder = { version = "0.7", default-features = false, features = ["std", "simd"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Phase 7 MCP servers: JSON only. `serde_json` is pure Rust and was already in
# Cargo.lock (xtask uses it), so this adds no new crate to the build. There is no
# HTTP or MCP framework crate: HTTP/1.1 + SSE are hand-rolled on tokio.
serde_json = "1"

# Model textures (space-render's GLB loader), both pure Rust with no build
# script. `miniz_oxide` is the inflate/deflate under the PNG decoder and encoder
# in `space-render/src/texture.rs` (the PNG container itself is implemented
# there, so no `png`/`flate2`/`crc32fast` crates); its only dependency is
# `adler2`. `jpeg-decoder` reads JPEG base-colour images; with default features
# off it has no dependencies (no rayon).
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
jpeg-decoder = { version = "0.3", default-features = false }

# Headless client harness (`space-harness`): the control trait, the HTTP API and
# Lua test scripts. The Lua interpreter must be pure Rust (no `mlua`/`rlua`: they
# compile or link C Lua). `lunita` is a pure-Rust Lua VM, a fork of kyren's
# `piccolo` made for untrusted scripts: memory and string-length limits, fuel
# charged in proportion to work (so one VM step is bounded and a script can
# always be stopped) and the complete `string` and `table` libraries — all of
# which crates/space-harness/tests/lua.rs exercises. No build script, no proc
# macro of its own, no file/network/process access in the library; it adds four
# crates to the lockfile (`lunita`, `gc-arena`, `gc-arena-derive`, `anyhow`).
# Pinned exactly: it is a young (first release 2026-10), single-maintainer crate,
# so an upgrade should be a reviewed change, not a `cargo update`.
# Why not `piccolo` itself: 0.3.3 (its last release, 2024) panics on ordinary
# table code (`t.a=nil; t.d=4` after three inserts), has no `tonumber`,
# `string.format` or `table.insert`, and cannot bound memory or the time of one
# step; see crates/space-harness/src/script.rs. Everything that touches the
# interpreter is in that one file, should it ever be replaced.
space-harness = { path = "crates/space-harness" }
lunita = "=0.1.2"

# Rigid-body physics for `space-sim` (contacts, joints, CCD) and its collision
# shapes (`parry3d-f64`, re-exported as `rapier3d_f64::parry`). Pure Rust,
# Apache-2.0, no build script compiles C (checked with `cargo tree`; see
# crates/space-sim/src/rigid.rs for the list it adds to the lockfile).
# * `-f64`: the physics runs in floating-origin "bubbles" (local frames a few
#   kilometres across, anchored at cells of the i64 world); f64 keeps contacts
#   far below the WorldPos resolution there (precision table and bubble rules
#   in crates/space-sim/src/rigid.rs).
# * `enhanced-determinism`: same platform + same inputs = bit-identical state
#   (libm for transcendentals, no hash-map iteration order); the crate's
#   determinism contract depends on it. NOT `parallel` (thread scheduling would
#   be a second source of order).
# Pinned to the minor version: a rapier minor release changes the solver, and
# with it every simulated trajectory, so an upgrade is a reviewed change.
rapier3d-f64 = { version = "0.36", default-features = false, features = ["dim3", "f64", "std", "block-solver", "enhanced-determinism"] }

# Property tests (dev-dependency only: the frame decoder and the handoff guarantees). Pure
# Rust. Default features are off: `fork` and `timeout` would add `rusty-fork` and `tempfile`
# (a child process per case), which the tests do not need. The tests run it with a fixed seed
# and without regression files, so a failure is the same on every run.
# It adds these crates to the lockfile: proptest, core_detect, rand_xorshift, unarray (regex-syntax, rand and chacha20 were already there).
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.cargo]
# `space-world` in [workspace.dependencies] is reserved for the later Phase-1
# crates that build on it.
unused_workspace_dependencies = "allow"

# The interest-grid benchmark (1M inserts + 1000 sphere queries) must finish in
# under 2 s in a debug build; the hot loops are a few percent slower at
# opt-level 0 than at 1, so this crate is built with opt-level 1 even in dev.
# Scoped to the package so the rest of the workspace (xtask) stays at opt-level 0.
[profile.dev.package.space-world]
opt-level = 1

# Same reasoning as above: the archetype ECS benchmarks (1M spawn, 1M-row
# iteration) are timed in release, but the acceptance tests also run in debug
# where the column copies dominate.
[profile.dev.package.space-ecs]
opt-level = 1

# The pixel-stream frame path (box downscale + JPEG encode) runs once per frame.
# At opt-level 0 it alone costs more than the 33 ms frame budget, so a plain
# `cargo run -p space-client -- --stream ...` could not hold its frame rate.
# Both crates are small and rarely edited, so the extra compile time is paid once.
[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.space-stream]
opt-level = 3

# The physics. The shard tests that run the demo area on four shards step it
# for minutes of simulated time (`space-server/tests/four_cells.rs`), and at
# opt-level 0 the solver and the collision detection are where that time goes.
# `space-sim` is the glue around them (it reads and writes every body every
# tick). No dependency is added or changed by this: two crates the workspace
# already uses are built optimised once, and one small crate of ours. Measured
# on that test file: 6.7 s -> 0.84 s per 300 ticks. Floating-point results do
# not depend on the opt-level (no fast-math), so trajectories are the same in
# debug and release.
[profile.dev.package.rapier3d-f64]
opt-level = 3

[profile.dev.package.parry3d-f64]
opt-level = 3

[profile.dev.package.space-sim]
opt-level = 2

[profile.release]
lto = "thin"

# Dependencies carry no debug info in dev and test builds: nobody steps through
# them, and without it they compile faster, link faster and take far less disk.
# Workspace members keep full debug info ("*" does not match them); a backtrace
# through a dependency still names its functions, without line numbers.
[profile.dev.package."*"]
debug = false

# `quick`: optimised like release, but built to be REBUILT. No LTO, many
# codegen units and incremental compilation, so after an edit only the changed
# crate is recompiled and the link takes seconds. This is what the dev scripts
# build (`scripts/dev.*`, output in `target/quick`); everything that ships
# (release workflow, Docker images) stays on `release`.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
