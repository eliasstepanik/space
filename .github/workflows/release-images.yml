name: Release images

# Build the three server images and PUSH them to ghcr.io on every merge to main.
# (ci.yml's `docker` job only proves the Dockerfiles build; it never pushes.)
# Tags: `latest` and `sha-<7-char commit>`.
#
# After the FIRST push the repo owner must set each package to Public
# (GitHub > Packages > space-shard / space-orchestrator / space-client >
# Package settings > Change visibility) so the proxy host can pull anonymously.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "deploy/**"
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-images.yml"
  workflow_dispatch:

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: space-shard
            file: deploy/Dockerfile.shard
          - image: space-orchestrator
            file: deploy/Dockerfile.orchestrator
          - image: space-client
            file: deploy/Dockerfile.client
    steps:
      - uses: actions/checkout@v4
      - name: Short SHA
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/eliasstepanik/${{ matrix.image }}:latest
            ghcr.io/eliasstepanik/${{ matrix.image }}:sha-${{ steps.vars.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
