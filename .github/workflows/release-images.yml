name: Release images

# Build the three server images and PUSH them to ghcr.io on EVERY push to main.
# (ci.yml's `docker` job only proves the Dockerfiles build; it never pushes.)
#
# No path filter: whatever a commit touched, `sha-<commit>` exists for every
# pushed head. No `concurrency` group either: a group cancels the build of an
# older push, or drops it from the queue, when a newer one arrives.
#
# Tags: `sha-<7-char commit>` always. `latest` is moved afterwards, in ONE job
# (`latest`, below) that runs only when ALL THREE images of the commit were
# pushed, and only while that commit is still the head of main - so the slow
# build of an older push can never put `latest` back behind a newer one.
# (GitHub starts one run per push: of several commits pushed together, the
# head is the one that is built.)
#
# THE ORDER MATTERS. The orchestrator starts its shards itself, from the shard
# image of its own commit: `space-shard:sha-<commit>` is baked into the
# orchestrator image (build-arg SPACE_SHARD_IMAGE) and pulled by it on the
# host. Watchtower follows the orchestrator's `latest`. So `space-shard:sha-<commit>`
# must be in the registry BEFORE `space-orchestrator:latest` points at that
# commit: the `latest` job needs every build, and moves the orchestrator's tag
# last.
#
# After the FIRST push of an image the repo owner must set its package to
# Public (GitHub > Packages > space-shard / space-orchestrator / space-client >
# Package settings > Change visibility) so the proxy host can pull anonymously.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push:
    name: Push ${{ matrix.image }}
    # Self-hosted space-ci runner on the proxy host, directly (no container):
    # it needs the host's docker/buildx.
    runs-on: [self-hosted, linux, x64, space-ci]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: space-shard
            file: deploy/Dockerfile.shard
          - image: space-orchestrator
            file: deploy/Dockerfile.orchestrator
          - image: space-client
            file: deploy/Dockerfile.client
    env:
      IMAGE: ghcr.io/eliasstepanik/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Short SHA
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push :sha-${{ steps.vars.outputs.short }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short }}
          # Only the orchestrator's Dockerfile declares this argument: the
          # shard image of this very commit, which is what it starts its
          # shards from. (The other two builds say that they did not use it.)
          build-args: |
            SPACE_SHARD_IMAGE=ghcr.io/eliasstepanik/space-shard:sha-${{ steps.vars.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  latest:
    name: Move :latest
    # Only when every image of this commit is in the registry (`needs` on a
    # matrix job waits for all of its legs, and a failed leg fails it).
    needs: push
    runs-on: [self-hosted, linux, x64, space-ci]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/eliasstepanik
    steps:
      - name: Short SHA
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Asked after the builds, not before them: they are the slow part, and
      # main may have moved on meanwhile.
      - name: Is this commit still the head of main?
        id: head
        uses: actions/github-script@v7
        with:
          script: |
            const { data: main } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            const head = main.commit.sha === context.sha;
            if (!head) {
              core.notice(`main is at ${main.commit.sha.slice(0, 7)}: that push's run moves :latest`);
            }
            core.setOutput('head', String(head));
      - uses: docker/setup-buildx-action@v3
        if: steps.head.outputs.head == 'true'
      - uses: docker/login-action@v3
        if: steps.head.outputs.head == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry-side retags of the images pushed above: nothing is rebuilt, so
      # `latest` and `sha-<commit>` are the same digest. The shard and the
      # client first, THE ORCHESTRATOR LAST: its `latest` is what the host
      # follows, and by then everything it starts or serves is there.
      - name: Move space-shard:latest
        if: steps.head.outputs.head == 'true'
        run: docker buildx imagetools create --tag "$REGISTRY/space-shard:latest" "$REGISTRY/space-shard:sha-${{ steps.vars.outputs.short }}"
      - name: Move space-client:latest
        if: steps.head.outputs.head == 'true'
        run: docker buildx imagetools create --tag "$REGISTRY/space-client:latest" "$REGISTRY/space-client:sha-${{ steps.vars.outputs.short }}"
      - name: Move space-orchestrator:latest (last)
        if: steps.head.outputs.head == 'true'
        run: docker buildx imagetools create --tag "$REGISTRY/space-orchestrator:latest" "$REGISTRY/space-orchestrator:sha-${{ steps.vars.outputs.short }}"
