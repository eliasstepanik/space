name: Release

# On a `v*` tag: build the native client for Linux and Windows and the wasm
# viewer bundle, then attach them to a GitHub Release with generated notes.
#
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  client:
    name: Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            binary: space-client
          - os: windows-latest
            binary: space-client.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build space-client
        run: cargo build --release --locked -p space-client
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.os }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error

  viewer:
    name: Wasm viewer bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build space-viewer for wasm32-unknown-unknown
        run: cargo build --release --locked --target wasm32-unknown-unknown -p space-viewer
      # Must match the wasm-bindgen version in Cargo.lock (see crates/space-viewer/README.md).
      - name: Install wasm-bindgen-cli
        run: cargo install --locked wasm-bindgen-cli --version 0.2.130
      - name: Generate JS glue
        run: |
          wasm-bindgen --target web --out-dir space-viewer/pkg \
            target/wasm32-unknown-unknown/release/space_viewer.wasm
          cp crates/space-viewer/index.html space-viewer/index.html
      - name: Zip bundle
        run: zip -r space-viewer.zip space-viewer
      - uses: actions/upload-artifact@v4
        with:
          name: viewer
          path: space-viewer.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [client, viewer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List release files
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/space-client
            dist/space-client.exe
            dist/space-viewer.zip
