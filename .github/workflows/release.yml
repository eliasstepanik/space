name: Release

# On a `v*` tag: build the native client for Linux and Windows and the wasm
# viewer bundle, then attach them to a GitHub Release with generated notes.
#
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

