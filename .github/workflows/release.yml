  publish:
    name: Publish GitHub Release
    needs: [client-linux, client-windows, viewer]
    runs-on: [self-hosted, linux, x64, space-ci]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List release files
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/space-client
            dist/space-client.exe
            dist/space-viewer.zip
