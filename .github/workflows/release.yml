name: Release

# Every push to `main` is a release. The run takes the next patch version after
# the highest `vX.Y.Z` tag, tags the pushed commit with it, builds the native
# client for Linux and Windows and the wasm viewer bundle, and attaches them to
# a GitHub Release with generated notes. Nothing is tagged by hand.
#
# Pushing a `v*` tag yourself still releases that tag, and is how the minor or
# major version moves; the automatic numbering carries on from the highest tag:
#
#   git tag v0.2.0 && git push origin v0.2.0      # the next push to main is v0.2.1
#
# GitHub starts one run per push, not per commit: of several commits pushed
# together, the head is the one that is built and released.
#
# No `concurrency` group on purpose. A group either cancels the run of an older
# push or drops it from the queue when a newer one arrives, and then not every
# push would get its release. Runs build in parallel instead; the `version` job
# hands the numbers out in push order (see .github/scripts/release_version.js).

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux jobs run BARE on the self-hosted `space-ci` runner (proxy host) and
  # install Rust via rustup (job containers do not work with its dind sidecar);
  # the Windows job stays on GitHub-hosted `windows-latest`.

  # First and fast, so that numbers follow push order. A build that fails
  # afterwards leaves its tag without a release; re-running the failed jobs
  # publishes to that same tag.
  version:
    name: Version
    runs-on: [self-hosted, linux, x64, space-ci]
    permissions:
      contents: write
    outputs:
      # Empty when the commit already carries a hand-pushed `v*` tag: that
      # tag's own run publishes it, this one only builds.
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the release tag
        id: pick
        uses: actions/github-script@v7
        with:
          script: |
            const { pickTag } = require('./.github/scripts/release_version.js');
            await pickTag({ github, context, core });

  client-linux:
    name: Client (linux)
    runs-on: [self-hosted, linux, x64, space-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rustup, idempotent)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Outside the workspace, so it survives the run and only what changed is
      # rebuilt (.github/scripts/ci_target_dir.sh).
      - name: Keep the build directory between runs
        run: bash .github/scripts/ci_target_dir.sh release
      - name: Build space-client
        run: cargo build --release --locked -p space-client
      - uses: actions/upload-artifact@v4
        with:
          name: client-linux
          path: ${{ env.CARGO_TARGET_DIR }}/release/space-client
          if-no-files-found: error

  client-windows:
    name: Client (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Hosted runners start empty: restore the compiled dependencies (keyed by
      # Cargo.lock and the toolchain).
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build space-client
        run: cargo build --release --locked -p space-client
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: target/release/space-client.exe
          if-no-files-found: error

  viewer:
    name: Wasm viewer bundle
    runs-on: [self-hosted, linux, x64, space-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rustup, idempotent)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Keep the build directory between runs
        run: bash .github/scripts/ci_target_dir.sh wasm
      - name: Build space-viewer for wasm32-unknown-unknown
        run: cargo build --release --locked --target wasm32-unknown-unknown -p space-viewer
      # The CLI must be the exact version of the `wasm-bindgen` crate in
      # Cargo.lock, so read it from there: this runs on every push, and a
      # hard-coded number would fail every release after a dependency update.
      # A no-op when that version is already installed on the runner; slow
      # from source otherwise (the bare runner has no prebuilt binary).
      - name: Install wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          set -euo pipefail
          version="$(awk -F'"' '$1 == "name = " && $2 == "wasm-bindgen" { getline; print $2; exit }' Cargo.lock)"
          test -n "$version"
          cargo install --locked wasm-bindgen-cli --version "$version"
      - name: Generate JS glue
        run: |
          wasm-bindgen --target web --out-dir space-viewer/pkg \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/space_viewer.wasm"
          cp crates/space-viewer/index.html space-viewer/index.html
      # The bare runner does not ship zip.
      - name: Install zip
        run: apt-get update && apt-get install -y --no-install-recommends zip
      - name: Zip bundle
        run: zip -r space-viewer.zip space-viewer
      - uses: actions/upload-artifact@v4
        with:
          name: viewer
          path: space-viewer.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, client-linux, client-windows, viewer]
    if: needs.version.outputs.tag != ''
    runs-on: [self-hosted, linux, x64, space-ci]
    permissions:
      contents: write
    steps:
      # For .github/scripts; before the download, because it cleans the workspace.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List release files
        run: ls -l dist
      # Runs for different pushes may finish out of order: only the highest
      # published version is marked "Latest".
      - name: Is this the newest release?
        id: latest
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        with:
          script: |
            const { makeLatest } = require('./.github/scripts/release_version.js');
            await makeLatest({ github, context, core }, process.env.RELEASE_TAG);
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          make_latest: ${{ steps.latest.outputs.make_latest }}
          generate_release_notes: true
          files: |
            dist/space-client
            dist/space-client.exe
            dist/space-viewer.zip
