name: CI

# Where the jobs run:
#   * Linux jobs (lint, linux, wasm, docker) run BARE on SELF-HOSTED runners
#     labelled `space-ci` (Linux, x64, dind over TCP) on the maintainer's
#     `proxy` host. They install Rust via rustup (no job `container:`), because
#     the runner's docker-in-docker sidecar cannot mount the runner's tool dirs
#     into job containers (actions/checkout fails with a missing /__e/node24).
#     The docker job uses the runner's docker/buildx directly.
#   * The Windows job stays on GitHub-hosted `windows-latest`: it cannot run on
#     the Linux self-hosted runner (assumption: no Windows self-hosted runner).

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # GitHub rejects a whole workflow whose YAML is invalid (it then shows up as a
  # missing run, not a red one). Parse every workflow and deploy compose file.
  lint:
    name: Workflow YAML
    runs-on: [self-hosted, linux, x64, space-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml || pip3 install --user pyyaml || (apt-get update && apt-get install -y python3-yaml)
      - name: Parse .github/workflows and deploy YAML
        run: python3 .github/scripts/check_yaml.py

  linux:
    name: Linux
    runs-on: [self-hosted, linux, x64, space-ci]
    steps:
      - uses: actions/checkout@v4
      # Bare runner has no Rust; bootstrap rustup, then `rustup toolchain
      # install` below reads rust-toolchain.toml (1.100.0).
      - name: Install Rust (rustup, idempotent)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Cache only the cargo registry/git downloads (real host paths on the
      # bare runner); target/ is too big to be worth caching.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Userspace Vulkan stack for the GPU-ish checks below. The bare runner
      # runs as root on Ubuntu jammy, so apt works directly (no sudo). (The
      # agent sandbox has a read-only /var/lib/apt, where `cargo xtask
      # gpu-setup` unpacks pinned .debs instead.) python3 is for the
      # ray_query report script.
      - name: Install Vulkan drivers, validation layer and tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            vulkan-tools \
            python3
      # Report-only guard: does the software (lavapipe) device the runner exposes
      # support VK_KHR_ray_query? Phase 4/5 ray-query work depends on this being
      # answerable from CI, but nothing here can run the GPU spikes yet, so this
      # step records the answer and never fails the build.
      - name: Vulkan capability report (lavapipe ray_query) — report only
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "::group::vulkaninfo --summary"
          vulkaninfo --summary || true
          echo "::endgroup::"
          vulkaninfo --json > vulkaninfo.json || true
          if [ -s vulkaninfo.json ]; then
            python3 .github/scripts/ray_query_report.py \
              || echo "ray_query: could not be determined from vulkaninfo.json"
          else
            echo "vulkaninfo produced no JSON; no Vulkan device on this runner"
          fi
      - name: cargo run -p xtask -- ci
        run: cargo run -p xtask -- ci
      # GPU tests on the runner's software Vulkan device (lavapipe), with the
      # Khronos validation layer enabled. `SPACE_RENDER_VALIDATION=1` makes
      # `RenderContext::new` request the layer, and every render test asserts
      # `validation_messages == 0`, so a layout or barrier regression fails here
      # rather than shipping. The exact-pixel tests must pass on lavapipe.
      #
      # `continue-on-error: true` on purpose: this has never been run on the
      # self-hosted runner (no GPU) (the authoring sandbox is not one), and both the
      # lavapipe ICD file name below and the layer path depend on the runner's
      # Mesa packaging. With SPACE_RENDER_VALIDATION=1 a missing layer is a hard
      # failure, so until a green run on a hosted runner proves the environment,
      # this step reports but does not gate. Flip it to false once it has.
      - name: GPU tests (lavapipe + validation layer)
        continue-on-error: true
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_LAYER_PATH: /usr/share/vulkan/explicit_layer.d
          SPACE_RENDER_VALIDATION: "1"
        run: cargo test -p space-render -p space-client -- --test-threads=1
      # The `naga < 30` guard lives in `crates/space-render/build.rs`
      # (`assert_naga_at_least_30`), which runs on every build of the renderer
      # and fails the build if naga resolves below 30 — naga 24 cannot compile
      # the WGSL ray-query shaders (see spikes/rq-triangle/README.md). The guard
      # therefore fires locally and in `cargo xtask ci`, not only in a log line.

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo run -p xtask -- ci
        run: cargo run -p xtask -- ci

  # The browser viewer is a wasm cdylib; the xtask ci only checks it as a
  # native rlib, so build it for the real target too. Build only: there is no
  # browser in this job (wasm-bindgen glue is a manual step, see
  # crates/space-viewer/README.md).
  wasm:
    name: Wasm viewer
    runs-on: [self-hosted, linux, x64, space-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rustup, idempotent)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build space-viewer for wasm32-unknown-unknown
        run: cargo build --release --locked --target wasm32-unknown-unknown -p space-viewer

  # Build every image to prove the Dockerfiles parse and compile; nothing is
  # pushed or run. (The container *runtime* behaviour is not exercised here.)
  docker:
    name: Docker build (${{ matrix.file }})
    # Directly on the runner (no container): it needs the host's docker/buildx.
    runs-on: [self-hosted, linux, x64, space-ci]
    strategy:
      fail-fast: false
      matrix:
        file:
          - Dockerfile
          - deploy/Dockerfile.shard
          - deploy/Dockerfile.orchestrator
          - deploy/Dockerfile.client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker buildx build (no push)
        run: docker buildx build --file ${{ matrix.file }} --tag space-ci/test:latest .
