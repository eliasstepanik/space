name: CI

# Where the jobs run:
#   * Linux jobs (lint, supply-chain, linux, wasm, docker, docker-e2e) run BARE on SELF-HOSTED runners
#     labelled `space-ci` (Linux, x64, dind over TCP) on the maintainer's
#     `proxy` host. They install Rust via rustup (no job containers), because
#     the runner's docker-in-docker sidecar cannot mount the runner's tool dirs
#     into job containers (actions/checkout fails with a missing /__e/node24).
#     The docker job uses the runner's docker/buildx directly.
#   * The Windows job stays on GitHub-hosted `windows-latest`: it cannot run on
#     the Linux self-hosted runner (assumption: no Windows self-hosted runner).

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # GitHub rejects a whole workflow whose YAML is invalid (it then shows up as a
  # missing run, not a red one). Parse every workflow and deploy compose file.
  lint:
    name: Workflow YAML
    runs-on: [self-hosted, linux, x64, space-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml || pip3 install --user pyyaml || (apt-get update && apt-get install -y python3-yaml)
      - name: Parse .github/workflows and deploy YAML
        run: python3 .github/scripts/check_yaml.py
      # Picks up .github/actionlint.yaml (custom runner label).
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # Supply chain: RustSec advisories (cargo-audit) and licenses / bans /
  # sources (cargo-deny).
  supply-chain:
    name: Supply chain
    runs-on: [self-hosted, linux, x64, space-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rustup, idempotent)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check
        run: cargo deny check

  linux:
    name: Linux
    runs-on: [self-hosted, linux, x64, space-ci]
    steps:
      - uses: actions/checkout@v4
      # Bare runner has no Rust; bootstrap rustup, then `rustup toolchain
      # install` below reads rust-toolchain.toml (1.100.0).
      - name: Install Rust (rustup, idempotent)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Cache only the cargo registry/git downloads (real host paths on the
      # bare runner); target/ is too big to be worth caching.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # The build directory lives outside the workspace and survives the run
      # (checkout wipes `target/`), so only what changed is rebuilt.
      - name: Keep the build directory between runs
        run: bash .github/scripts/ci_target_dir.sh ci
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Userspace Vulkan stack for the GPU-ish checks below. The bare runner
      # runs as root on Ubuntu jammy, so apt works directly (no sudo). (The
      # agent sandbox has a read-only /var/lib/apt, where `cargo xtask
      # gpu-setup` unpacks pinned .debs instead.) python3 is for the
      # ray_query report script.
      - name: Install Vulkan drivers, validation layer and tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            vulkan-tools \
            python3
      # Report-only guard: does the software (lavapipe) device the runner exposes
      # support VK_KHR_ray_query? Phase 4/5 ray-query work depends on this being
      # answerable from CI, but nothing here can run the GPU spikes yet, so this
      # step records the answer and never fails the build.
      - name: Vulkan capability report (lavapipe ray_query) — report only
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "::group::vulkaninfo --summary"
          vulkaninfo --summary || true
          echo "::endgroup::"
          vulkaninfo --json > vulkaninfo.json || true
          if [ -s vulkaninfo.json ]; then
            python3 .github/scripts/ray_query_report.py \
              || echo "ray_query: could not be determined from vulkaninfo.json"
          else
            echo "vulkaninfo produced no JSON; no Vulkan device on this runner"
          fi
      - name: cargo run -p xtask -- ci
        run: cargo run -p xtask -- ci
      # GPU tests on the runner's software Vulkan device (lavapipe), with the
      # Khronos validation layer enabled. `SPACE_RENDER_VALIDATION=1` makes
      # `RenderContext::new` request the layer, and every render test asserts
      # `validation_messages == 0`, so a layout or barrier regression fails here
      # rather than shipping. The exact-pixel tests must pass on lavapipe.
      #
      # `continue-on-error: true` on purpose: the runner's Mesa (jammy, 23.x)
      # ships a lavapipe without VK_KHR_acceleration_structure, which the
      # renderer needs, so no context can be created there. SPACE_REQUIRE_GPU=1
      # makes that a *failed* step instead of thirteen "passed" tests that
      # rendered nothing (which is what this step used to report): the job stays
      # green, but the step is red until the runner has Mesa >= 24.1 or a real
      # GPU. Once it has, drop `continue-on-error` so the GPU tests gate.
      #
      # SPACE_SKIP_TIMING=1: this pass is for what renders. The crossing
      # tests of space-client (tests/seamless.rs: a real client flown through
      # four shards in real time, minutes of it, nothing rendered) have run
      # in the xtask step above and are not run a second time here.
      - name: GPU tests (lavapipe + validation layer)
        continue-on-error: true
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_LAYER_PATH: /usr/share/vulkan/explicit_layer.d
          SPACE_RENDER_VALIDATION: "1"
          SPACE_REQUIRE_GPU: "1"
          SPACE_SKIP_TIMING: "1"
        # In xtask's test directory, to reuse the test build `xtask ci` just made.
        run: CARGO_TARGET_DIR="$CARGO_TARGET_DIR/xtask-test" cargo test -p space-render -p space-client -- --test-threads=1
      # The `naga < 30` guard lives in `crates/space-render/build.rs`
      # (`assert_naga_at_least_30`), which runs on every build of the renderer
      # and fails the build if naga resolves below 30 — naga 24 cannot compile
      # the WGSL ray-query shaders (see spikes/rq-triangle/README.md). The guard
      # therefore fires locally and in `cargo run -p xtask -- ci`, not only in a log line.

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Hosted runners start empty: restore the compiled dependencies (keyed by
      # Cargo.lock and the toolchain). `xtask ci` builds the tests in
      # target/xtask-test, so both directories are listed.
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> target/xtask-test
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo run -p xtask -- ci
        run: cargo run -p xtask -- ci

  # The browser viewer is a wasm cdylib; the xtask ci only checks it as a
  # native rlib, so build it for the real target too. Build only: there is no
  # browser in this job (wasm-bindgen glue is a manual step, see
  # crates/space-viewer/README.md).
  wasm:
    name: Wasm viewer
    runs-on: [self-hosted, linux, x64, space-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rustup, idempotent)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Keep the build directory between runs
        run: bash .github/scripts/ci_target_dir.sh wasm
      - name: Build space-viewer for wasm32-unknown-unknown
        run: cargo build --release --locked --target wasm32-unknown-unknown -p space-viewer

  # Build every image to prove the Dockerfiles parse and compile; nothing is
  # pushed or run. (The container *runtime* behaviour is exercised by `docker-e2e` below.)
  # On a push to main the three deploy images are skipped: release-images.yml
  # builds (and pushes) exactly those from the same commit, and building each
  # twice on the one runner only makes every push slower. Pull requests, where
  # release-images.yml does not run, still build all four.
  docker:
    name: Docker build (${{ matrix.file }})
    # Directly on the runner (no container): it needs the host's docker/buildx.
    runs-on: [self-hosted, linux, x64, space-ci]
    strategy:
      fail-fast: false
      matrix:
        file:
          - Dockerfile
          - deploy/Dockerfile.shard
          - deploy/Dockerfile.orchestrator
          - deploy/Dockerfile.client
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || matrix.file == 'Dockerfile'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request' || matrix.file == 'Dockerfile'
      - name: docker buildx build (no push)
        if: github.event_name == 'pull_request' || matrix.file == 'Dockerfile'
        run: docker buildx build --file ${{ matrix.file }} --tag space-ci/test:latest .

  # The local compose stack, run for real: `xtask e2e` builds the shard image,
  # starts deploy/docker-compose.yaml as the compose project `space-e2e` on its
  # own ports, waits for four shard containers, flies one player (no renderer:
  # crates/space-client/tests/live_stack.rs) across a shard border and takes
  # the stack down again. The daemon is the runner's dind over TCP, so the
  # player port is dialed on the DOCKER_HOST's host, which xtask reads itself.
  # One run at a time: the project name and the ports are fixed. (A newer
  # waiting run replaces an older waiting one; a running one is never cancelled.)
  docker-e2e:
    name: Docker E2E (compose stack, one handoff)
    runs-on: [self-hosted, linux, x64, space-ci]
    timeout-minutes: 90
    concurrency:
      group: docker-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rustup, idempotent)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # `xtask e2e` exits 2 without the compose plugin; the runner image may not have it.
      - name: docker compose (install the plugin if the runner has none)
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -sSfL -o "$HOME/.docker/cli-plugins/docker-compose" \
              https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          fi
          docker compose version
      - name: cargo run -p xtask -- e2e
        run: cargo run -p xtask -- e2e
